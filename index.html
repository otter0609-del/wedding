<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>진승현 & 박지선의 모바일 청첩장</title>
  
  <!-- 카카오톡 공유 시 뜰 썸네일 및 문구 -->
  <meta property="og:title" content="진승현 & 박지선의 결혼 소식을 전합니다" />
  <meta property="og:description" content="저희 두 사람의 새로운 시작을 따뜻한 마음으로 축복해 주세요." />
  <meta property="og:image" content="cover.gif" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    
    /* 모바일 프레임 너비 */
    .container {
      width: 100%;
      max-width: 430px;
      background-color: #ffffff;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      padding-bottom: 50px;
    }

    /* GIF 이미지 */
    .gif-img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 섹션 스타일 */
    .content-section {
      padding: 35px 20px 10px 20px;
      text-align: center;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      color: #333;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    /* 접기/펴기 아코디언 박스 */
    .accordion {
      margin-bottom: 12px;
      border: 1px solid #eaeaea;
      border-radius: 12px;
      overflow: hidden;
      background-color: #fff;
    }

    .accordion-header {
      width: 100%;
      padding: 15px 18px;
      background-color: #fafafa;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: #444;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .accordion-header::after {
      content: '▼';
      font-size: 11px;
      color: #888;
      transition: transform 0.2s;
    }

    .accordion-header.active::after {
      transform: rotate(180deg);
    }

    .accordion-body {
      display: none;
      padding: 12px 16px 4px 16px;
      background-color: #ffffff;
    }

    .accordion-body.open {
      display: block;
    }

    /* 계좌 한 개 카드 */
    .account-card {
      border-bottom: 1px solid #f0f0f0;
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .account-card:last-child {
      border-bottom: none;
    }

    .account-info { text-align: left; }
    .account-holder { font-size: 13px; font-weight: 600; color: #555; }
    .account-detail { font-size: 14px; color: #222; margin-top: 2px; }

    /* 복사 버튼 */
    .btn-copy {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      background-color: #f1f5f9;
      color: #334155;
      cursor: pointer;
    }
    .btn-copy:active { background-color: #e2e8f0; }

    /* 복사 완료 토스트 알림 */
    #toast {
      visibility: hidden;
      min-width: 200px;
      background-color: rgba(0,0,0,0.8);
      color: #fff;
      text-align: center;
      border-radius: 20px;
      padding: 10px 16px;
      position: fixed;
      z-index: 99;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
    }
    #toast.show {
      visibility: visible;
      animation: fadein 0.3s, fadeout 0.3s 1.7s;
    }

    @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 30px; opacity: 1; } }
    @keyframes fadeout { from { bottom: 30px; opacity: 1; } to { bottom: 0; opacity: 0; } }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. 표지 GIF -->
    <img src="cover.gif" alt="청첩장 표지" class="gif-img">

    <!-- 2. 본문 GIF -->
    <img src="body.gif" alt="청첩장 본문" class="gif-img">

    <!-- 3. 마음 전하실 곳 (계좌번호) -->
    <div class="content-section">
      <div class="section-title">💌 마음 전하실 곳</div>

      <!-- ==================== 신랑측 계좌 (2개) ==================== -->
      <div class="accordion">
        <button class="accordion-header" onclick="toggleAccordion('groom-accounts', this)">
          신랑측 계좌번호 보기
        </button>
        <div id="groom-accounts" class="accordion-body">
          <!-- 김태숙 -->
          <div class="account-card">
            <div class="account-info">
              <div class="account-holder">김태숙</div>
              <div class="account-detail">하나은행 149-891189-20807</div>
            </div>
            <button class="btn-copy" onclick="copyText('14989118920807')">복사</button>
          </div>
          <!-- 진승현 -->
          <div class="account-card">
            <div class="account-info">
              <div class="account-holder">신랑 진승현</div>
              <div class="account-detail">우리은행 1002-845-491292</div>
            </div>
            <button class="btn-copy" onclick="copyText('1002845491292')">복사</button>
          </div>
        </div>
      </div>

      <!-- ==================== 신부측 계좌 (3개) ==================== -->
      <div class="accordion">
        <button class="accordion-header" onclick="toggleAccordion('bride-accounts', this)">
          신부측 계좌번호 보기
        </button>
        <div id="bride-accounts" class="accordion-body">
          <!-- 박재득 -->
          <div class="account-card">
            <div class="account-info">
              <div class="account-holder">박재득</div>
              <div class="account-detail">농협 169-02-538006</div>
            </div>
            <button class="btn-copy" onclick="copyText('16902538006')">복사</button>
          </div>
          <!-- 이순녀 -->
          <div class="account-card">
            <div class="account-info">
              <div class="account-holder">이순녀</div>
              <div class="account-detail">국민은행 163-01-0146-392</div>
            </div>
            <button class="btn-copy" onclick="copyText('163010146392')">복사</button>
          </div>
          <!-- 박지선 -->
          <div class="account-card">
            <div class="account-info">
              <div class="account-holder">신부 박지선</div>
              <div class="account-detail">농협 1088-12-126221</div>
            </div>
            <button class="btn-copy" onclick="copyText('108812126221')">복사</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 알림 토스트 -->
  <div id="toast">계좌번호가 복사되었습니다.</div>

  <script>
    // 아코디언 열고 닫기
    function toggleAccordion(id, btn) {
      var body = document.getElementById(id);
      body.classList.toggle('open');
      btn.classList.toggle('active');
    }

    // 계좌번호 복사
    function copyText(text) {
      navigator.clipboard.writeText(text).then(function() {
        showToast();
      }).catch(function(err) {
        var textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        showToast();
      });
    }

    function showToast() {
      var toast = document.getElementById("toast");
      toast.className = "show";
      setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 2000);
    }
  </script>
</body>
</html>
